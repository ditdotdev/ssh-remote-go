#
# Build and test on pull request - updated to force recognition
#
name: Pull Request

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'
      - name: Build
        run: go build -v ./...
      - name: Build command
        run: go build -o build/ssh ./cmd/ssh
      - name: Test
        run: go test -v ./...
